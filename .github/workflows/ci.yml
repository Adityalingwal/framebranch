
name: CI

on:
  push: # all branches (the plan job decides what actually runs)
  pull_request: # default types: opened, synchronize, reopened

permissions:
  contents: read
  pull-requests: read # needed by the open-PR lookup in `plan`

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_all: ${{ steps.skip.outputs.skip_all }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
      fuzz_total: ${{ steps.depth.outputs.fuzz_total }}
      fuzz_cases_per_shard: ${{ steps.depth.outputs.fuzz_cases_per_shard }}
      fuzz_offsets: ${{ steps.depth.outputs.fuzz_offsets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide skip_all (duplicate-of-open-PR push)
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ github.ref_name }}"
          if OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number 2>/dev/null); then
            if [ "$(echo "$OPEN_PRS" | jq 'length')" -gt 0 ]; then
              echo "skip_all=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Decide docs_only
        id: docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_DOCS=$(echo "$CHANGED" | grep -v -E '(^|/)[^/]+\.md$|^docs/' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide fuzz depth
        id: depth
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "fuzz_total=10000" >> "$GITHUB_OUTPUT"
            echo "fuzz_cases_per_shard=2000" >> "$GITHUB_OUTPUT"
            echo "fuzz_offsets=[0,2000,4000,6000,8000]" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz_total=500" >> "$GITHUB_OUTPUT"
            echo "fuzz_cases_per_shard=500" >> "$GITHUB_OUTPUT"
            echo "fuzz_offsets=[0]" >> "$GITHUB_OUTPUT"
          fi

  gate: # typecheck, lint, tests, coverage (~60s)
    needs: plan
    if: needs.plan.outputs.skip_all != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: framebranch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/framebranch_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the root package.json "packageManager" field.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Fill an empty database from the committed migration. Nothing is pushed
      # from the schema at runtime.
      - name: Migrate the test database
        run: pnpm --filter @framebranch/web db:migrate

      - name: Tests — unit + golden + integration
        run: pnpm test

      - name: Coverage report
        run: pnpm coverage

  fuzz: # fuzz, sharded — deliberately NOT gated on `gate`
    needs: plan
    if: needs.plan.outputs.skip_all != 'true' && needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        offset: ${{ fromJson(needs.plan.outputs.fuzz_offsets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fuzz shard
        env:
          FRAMEBRANCH_FUZZ_CASES: ${{ needs.plan.outputs.fuzz_cases_per_shard }}
          FRAMEBRANCH_FUZZ_OFFSET: ${{ matrix.offset }}
          FRAMEBRANCH_FUZZ_TOTAL: ${{ needs.plan.outputs.fuzz_total }}
        run: pnpm --filter @framebranch/engine fuzz

  ci-success:
    needs: [plan, gate, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check outcomes
        run: |
          echo "skip_all=${{ needs.plan.outputs.skip_all }} docs_only=${{ needs.plan.outputs.docs_only }} fuzz_offsets=${{ needs.plan.outputs.fuzz_offsets }}"
          echo "gate=${{ needs.gate.result }} fuzz=${{ needs.fuzz.result }}"
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "plan job did not succeed"
            exit 1
          fi
          case "${{ needs.gate.result }}" in
            success|skipped) ;;
            *) echo "gate did not pass"; exit 1 ;;
          esac
          case "${{ needs.fuzz.result }}" in
            success|skipped) ;;
            *) echo "fuzz did not pass"; exit 1 ;;
          esac
          echo "CI success"
