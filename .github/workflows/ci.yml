# FrameBranch CI — docs/12 T5 lock (2026-08-03), amended 2026-08-04 for CI
# speed:
#   T5 required set (unchanged): (1) typecheck (2) lint (3) unit+golden+
#   integration tests (4) fuzz 10k (seed-print) (5) coverage + lock-ID
#   gap-script. All five stay merge-blocking; the amendment is that they no
#   longer run as one strict sequence — `gate` (1-3) and `fuzz` (4) now run
#   IN PARALLEL as separate jobs, fanned out further into fuzz shards.
#   Sequence was never the point of the T5 lock, completeness was — see the
#   docs/12 T5 amendment block for the full reasoning. Step 5 (coverage +
#   gap-script) stays TODO(M7) as already locked, unaffected by this change.
#   Benchmarks are intentionally NOT in CI (T5 lock: CI hardware inconsistent
#   -> local script + committed report).
name: CI

on:
  push: # all branches (the plan job decides what actually runs)
  pull_request: # default types: opened, synchronize, reopened

permissions:
  contents: read
  pull-requests: read # needed by the open-PR lookup in `plan`

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The only job that thinks: decides whether this run is a no-op (duplicate
  # of an open PR's run), whether it's docs-only, and how deep the fuzz job
  # should go. Every downstream job just reads these outputs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_all: ${{ steps.skip.outputs.skip_all }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
      fuzz_total: ${{ steps.depth.outputs.fuzz_total }}
      fuzz_cases_per_shard: ${{ steps.depth.outputs.fuzz_cases_per_shard }}
      fuzz_shards: ${{ steps.depth.outputs.fuzz_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A bare `on: push` + `on: pull_request` makes GitHub run the whole
      # pipeline TWICE for every PR-branch commit (once for push, once for
      # pull_request). When this is a push on a non-main branch AND an open
      # PR already exists for that branch, the PR run covers it — skip.
      # Fail open: a lookup error must not silently skip real CI.
      - name: Decide skip_all (duplicate-of-open-PR push)
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ github.ref_name }}"
          if OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number 2>/dev/null); then
            if [ "$(echo "$OPEN_PRS" | jq 'length')" -gt 0 ]; then
              echo "skip_all=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_all=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
          fi

      # docs-only: every changed file matches *.md or docs/**. A commit
      # touching docs AND code is NOT docs-only. Fail open (not-docs-only)
      # when the diff base can't be determined (new branch / force push).
      - name: Decide docs_only
        id: docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_DOCS=$(echo "$CHANGED" | grep -v -E '(^|/)[^/]+\.md$|^docs/' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Trigger ladder (docs/12 T5 amendment decision 7): pull_request and
      # push-to-main get the full 10k, 5 shards x 2,000; everything else
      # (feature-branch push with no open PR) gets a 500-case smoke, 1 shard.
      - name: Decide fuzz depth
        id: depth
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "fuzz_total=10000" >> "$GITHUB_OUTPUT"
            echo "fuzz_cases_per_shard=2000" >> "$GITHUB_OUTPUT"
            echo "fuzz_shards=[0,1,2,3,4]" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz_total=500" >> "$GITHUB_OUTPUT"
            echo "fuzz_cases_per_shard=500" >> "$GITHUB_OUTPUT"
            echo "fuzz_shards=[0]" >> "$GITHUB_OUTPUT"
          fi

  gate: # T5 steps 1-3: typecheck, lint, tests (~60s)
    needs: plan
    if: needs.plan.outputs.skip_all != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the root package.json "packageManager" field.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (T5 step 1)
        run: pnpm typecheck

      - name: Lint (T5 step 2)
        run: pnpm lint

      - name: Tests — unit + golden + integration (T5 step 3)
        run: pnpm test

      # TODO(M7): Coverage + lock-ID gap-script (T5 step 5). Enable at the
      # M7 CI-closure once the implemented lock/test universe is complete.
      # - name: Coverage + lock-ID gap-script (T5 step 5)
      #   run: pnpm --filter @framebranch/engine coverage && node scripts/lock-id-gap-check.mjs

  fuzz: # T5 step 4: fuzz, sharded — deliberately NOT gated on `gate`
    needs: plan
    if: needs.plan.outputs.skip_all != 'true' && needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.fuzz_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fuzz shard (T5 step 4)
        env:
          FRAMEBRANCH_FUZZ_CASES: ${{ needs.plan.outputs.fuzz_cases_per_shard }}
          FRAMEBRANCH_FUZZ_OFFSET: ${{ matrix.shard * needs.plan.outputs.fuzz_cases_per_shard }}
          FRAMEBRANCH_FUZZ_TOTAL: ${{ needs.plan.outputs.fuzz_total }}
        # Seed intentionally NOT set — the harness default (1295277908) stays
        # in force, matching the docs/07 / docs/11 M4 evidence seed.
        run: pnpm --filter @framebranch/engine fuzz

  # Single aggregate check for branch protection. Succeeds only when both
  # `gate` and `fuzz` ended success-or-skipped; fails on any cancelled/failed
  # job (including plan itself).
  ci-success:
    needs: [plan, gate, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check outcomes
        run: |
          echo "skip_all=${{ needs.plan.outputs.skip_all }} docs_only=${{ needs.plan.outputs.docs_only }} fuzz_shards=${{ needs.plan.outputs.fuzz_shards }}"
          echo "gate=${{ needs.gate.result }} fuzz=${{ needs.fuzz.result }}"
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "plan job did not succeed"
            exit 1
          fi
          case "${{ needs.gate.result }}" in
            success|skipped) ;;
            *) echo "gate did not pass"; exit 1 ;;
          esac
          case "${{ needs.fuzz.result }}" in
            success|skipped) ;;
            *) echo "fuzz did not pass"; exit 1 ;;
          esac
          echo "CI success"
